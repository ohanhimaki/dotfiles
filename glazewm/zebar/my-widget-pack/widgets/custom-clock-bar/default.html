<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Clock Bar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Fira Code', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(0, 0, 0, 0.8);
      color: #ffffff;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 40px;
      padding: 0 20px;
    }

    .left-section,
    .center-section,
    .right-section {
      display: flex;
      align-items: center;
      gap: 15px;
      -webkit-app-region: no-drag;
    }

    .clock {
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      backdrop-filter: blur(10px);
    }

    .time {
      color: #8dbcff;
      font-weight: 600;
    }

    .date {
      color: #a1a1a1;
      margin-left: 10px;
    }

    .workspaces {
      display: flex;
      gap: 8px;
    }

    .workspace {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 13px;
    }

    .workspace:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .workspace.active {
      background: #8dbcff;
      color: #000000;
      font-weight: 600;
    }

    .system-info {
      font-size: 13px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="left-section">
      <div class="workspaces" id="workspaces"></div>
    </div>

    <div class="center-section">
      <div class="clock" id="clock">
        <span class="time" id="time"></span>
        <span class="date" id="date"></span>
      </div>
    </div>

    <div class="right-section">
      <div class="system-info" id="system-info">System</div>
    </div>
  </div>

  <script>
    // Clock update function with hh:mm:ss dd.mm.yyyy format
    function updateClock() {
      const now = new Date();

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();

      document.getElementById('time').textContent = `${hh}:${mm}:${ss}`;
      document.getElementById('date').textContent = `${dd}.${MM}.${yyyy}`;
    }

    // Initialize workspaces (1-9)
    function initWorkspaces() {
      const workspacesContainer = document.getElementById('workspaces');
      for (let i = 1; i <= 9; i++) {
        const workspace = document.createElement('div');
        workspace.className = 'workspace';
        workspace.textContent = i;
        workspace.dataset.workspace = i;

        // Add click handler (you can integrate with GlazeWM if needed)
        workspace.addEventListener('click', () => {
          console.log(`Switching to workspace ${i}`);
          // You can add GlazeWM integration here
        });

        workspacesContainer.appendChild(workspace);
      }

      // Set workspace 1 as active by default
      workspacesContainer.children[0].classList.add('active');
    }

    // Update system info
    function updateSystemInfo() {
      const systemInfo = document.getElementById('system-info');
      systemInfo.textContent = `${navigator.platform}`;
    }

    // Initialize
    updateClock();
    setInterval(updateClock, 1000);
    initWorkspaces();
    updateSystemInfo();
  </script>
</body>
</html>
