# Starship Configuration
# Optimized for git, Python, and C# development
# Powerline-style colored segments, no triangle dividers
# Theme: Gruvbox, softened text and muted accents

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for starship to scan files (milliseconds)
scan_timeout = 30

# Add a new line before the prompt
add_newline = true

format = """
$os\
$username\
$git_branch\
$git_status\
$python\
$dotnet\
$nodejs\
$rust\
$golang\
$cmd_duration\
$time\
$line_break\
$directory\
$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fcfcfc'
color_fg1 = '#aaaaaa'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#3f6f71'
color_aqua = '#567d59'
color_green = '#74752e'
color_orange = '#a65f2b'
color_purple = '#946078'
color_red = '#a83e35'
color_yellow = '#b08a3e'
color_bright_yellow = '#d5b775'
color_black = '#282828'

# Prompt character (on separate line for input)
[character]
success_symbol = "[❯](fg:color_green)"
error_symbol = "[❯](fg:color_red)"
vimcmd_symbol = "[❮](fg:color_green)"

[os]
disabled = false
style = "fg:color_orange"
format = "[$symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Username
[username]
show_always = true
style_user = "fg:color_orange"
style_root = "bold fg:color_red"
format = '[ $user]($style)'
disabled = false

# Directory - the only module on the left
[directory]
style = "fg:color_blue"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 7
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "
read_only_style = "fg:color_red"
repo_root_style = "bold fg:color_fg0"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

# Git Branch
[git_branch]
format = "[ $symbol$branch]($style)"
style = "fg:color_green"

# Git Status with detailed info
[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "fg:color_green"
conflicted = "⚔️${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "" #📦${count}
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Python
[python]
symbol = "🐍 "
format = '[ $symbol($version )(\($virtualenv\) )]($style)'
style = "fg:color_aqua"
pyenv_version_name = false
python_binary = ["python3", "python"]
detect_extensions = ["py"]
detect_files = ["requirements.txt", ".python-version", "pyproject.toml", "Pipfile", "setup.py", "tox.ini", "setup.cfg"]
detect_folders = []

# .NET / C#
[dotnet]
symbol = "🎯 "
format = "[ $symbol($version )]($style)"
style = "fg:color_aqua"
heuristic = true
detect_extensions = ["csproj", "fsproj", "xproj", "sln"]
detect_files = ["global.json", "project.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]
detect_folders = []

# Node.js
[nodejs]
symbol = " "
format = "[ $symbol($version )]($style)"
style = "fg:color_aqua"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

# Rust
[rust]
symbol = "🦀 "
format = "[ $symbol($version )]($style)"
style = "fg:color_aqua"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]
detect_folders = []

# Go
[golang]
symbol = " "
format = "[ $symbol($version )]($style)"
style = "fg:color_aqua"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "go.work", "glide.yaml", "Gopkg.yml", "Gopkg.lock"]
detect_folders = ["Godeps"]

# Command duration
[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[ took $duration ]($style)"
style = "fg:color_fg1"

# Battery (for laptops)
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# Time
[time]
disabled = false
format = '[ 🕙 $time ]($style)'
time_format = "%R"
style = "fg:color_fg1"

# Disable modules you don't need
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true
