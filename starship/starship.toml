# Starship Configuration
# Optimized for git, Python, and C# development
# Clean two-sided prompt without Powerline background blocks
# Theme: Gruvbox

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Timeout for starship to scan files (milliseconds)
scan_timeout = 30

# Add a new line before the prompt
add_newline = true

# Left: directory only. The fill module pushes everything else to the right.
format = """
 $os\
$directory\
$fill\
$git_branch\
$git_status\
$python\
$dotnet\
$nodejs\
$rust\
$golang\
$time\
$line_break\
$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_fg1 = '#282828'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

# Prompt character (on separate line for input)
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[fill]
symbol = " "

[os]
disabled = true
style = "fg:color_blue"

[os.symbols]
Windows = "󰍲 "
Ubuntu = "󰕈 "
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Username
[username]
show_always = true
style_user = "fg:color_purple"
style_root = "bold fg:color_red"
format = '[$user ]($style)'
disabled = false

# Directory - the only module on the left
[directory]
style = "fg:color_blue"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 7
truncation_symbol = "…/"
truncate_to_repo = false
read_only = ""
read_only_style = "fg:color_red"
repo_root_style = "bold color_green"
repo_root_format = " [$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"

# Git Branch
[git_branch]
format = "[ $symbol$branch]($style)"
style = "bold color_green"

# Git Status with detailed info
[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "color_green"
conflicted = "⚔️${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "" #📦${count}
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Python
[python]
symbol = "🐍 "
format = '[ $symbol($version )(\($virtualenv\) )]($style)'
style = "color_aqua"
pyenv_version_name = false
python_binary = ["python3", "python"]
detect_extensions = ["py"]
detect_files = ["requirements.txt", ".python-version", "pyproject.toml", "Pipfile", "setup.py", "tox.ini", "setup.cfg"]
detect_folders = []

# .NET / C#
[dotnet]
symbol = "🎯 "
format = "[ $symbol($version )]($style)"
style = "color_aqua"
heuristic = true
detect_extensions = ["csproj", "fsproj", "xproj", "sln"]
detect_files = ["global.json", "project.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]
detect_folders = []

# Node.js
[nodejs]
symbol = " "
format = "[ $symbol($version )]($style)"
style = "color_aqua"
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

# Rust
[rust]
symbol = "🦀 "
format = "[ $symbol($version )]($style)"
style = "color_aqua"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]
detect_folders = []

# Go
[golang]
symbol = " "
format = "[ $symbol($version )]($style)"
style = "color_aqua"
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "go.work", "glide.yaml", "Gopkg.yml", "Gopkg.lock"]
detect_folders = ["Godeps"]

# Command duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

# Battery (for laptops)
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "💀"
unknown_symbol = "❓"
empty_symbol = "🪫"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# Time
[time]
disabled = false
format = '[ 🕙 $time ]($style)'
time_format = "%R"
style = "bold color_yellow"

# Disable modules you don't need
[aws]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true
