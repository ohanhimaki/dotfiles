# Kitty Terminal Configuration

# Font configuration
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Window layout
window_padding_width 4
window_margin_width 0
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Color scheme - Nord-inspired dark theme
foreground #D8DEE9
background #2E3440
selection_foreground #2E3440
selection_background #88C0D0

# Black
color0 #3B4252
color8 #4C566A

# Red
color1 #BF616A
color9 #BF616A

# Green
color2  #A3BE8C
color10 #A3BE8C

# Yellow
color3  #EBCB8B
color11 #EBCB8B

# Blue
color4  #81A1C1
color12 #81A1C1

# Magenta
color5  #B48EAD
color13 #B48EAD

# Cyan
color6  #88C0D0
color14 #8FBCBB

# White
color7  #E5E9F0
color15 #ECEFF4

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Advanced
shell .
editor .
allow_remote_control no
