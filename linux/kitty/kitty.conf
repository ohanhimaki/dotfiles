# Kitty Terminal Configuration

# Font configuration
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_trail 1

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Window layout
window_padding_width 4
window_margin_width 0
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Color scheme - OneDark
foreground #ABB2BF
background #282C34
selection_foreground #282C34
selection_background #ABB2BF

# Cursor
cursor #ABB2BF
cursor_text_color #282C34

# Black
color0 #282C34
color8 #5C6370

# Red
color1 #E06C75
color9 #BE5046

# Green
color2  #98C379
color10 #98C379

# Yellow
color3  #E5C07B
color11 #D19A66

# Blue
color4  #61AFEF
color12 #61AFEF

# Magenta
color5  #C678DD
color13 #C678DD

# Cyan
color6  #56B6C2
color14 #56B6C2

# White
color7  #ABB2BF
color15 #ABB2BF

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Advanced
shell .
editor .
allow_remote_control no
# Terminal type - fixes key handling issues with Neovim
#term xterm-kitty

