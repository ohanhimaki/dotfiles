# Kitty Terminal Configuration

# Font configuration
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 9.0

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_trail 1

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select yes

# Window layout
window_padding_width 4
window_margin_width 0
hide_window_decorations no
confirm_os_window_close 0

# Tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Color scheme - Gruvbox Dark (matching your VS Code and Windows Terminal theme)
foreground #EBDBB2
background #1D2021
selection_foreground #1D2021
selection_background #EBDBB2

# Cursor
cursor #EBDBB2
cursor_text_color #1D2021

# Black
color0 #3C3836
color8 #928374

# Red
color1 #DC322F
color9 #FB4934

# Green
color2  #859900
color10 #B8BB26

# Yellow
color3  #B58900
color11 #FABD2F

# Blue
color4  #458588
color12 #83A598

# Magenta
color5  #D33682
color13 #D3869B

# Cyan
color6  #689D6A
color14 #8EC07C

# White
color7  #EEE8D5
color15 #EBDBB2

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Advanced
shell .
editor .
allow_remote_control no
# Terminal type - fixes key handling issues with Neovim
#term xterm-kitty

# # Advanced
# allow_remote_control no

