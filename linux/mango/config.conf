# MangoWM: Super is the Windows key. Finnish / US keyboard.
xkb_rules_layout=fi,us
xkb_rules_options=grp:win_space_toggle,caps:escape
repeat_rate=35
repeat_delay=200
tap_to_click=1

exec_once=waybar -c ~/.config/mango/waybar.jsonc -s ~/.config/mango/waybar.css
exec_once=mako
exec_once=swaybg -c '#282c34'
exec_once=/usr/libexec/polkit-mate-authentication-agent-1
exec_once=swayidle -w timeout 600 'swaylock -f -c 282c34' before-sleep 'swaylock -f -c 282c34'

bind=SUPER,Return,spawn,python3 ~/.config/mango/focus-terminal.py
bind=SUPER+SHIFT,Return,spawn,wezterm start --always-new-process
bind=SUPER,D,spawn,fuzzel
bind=SUPER,Q,killclient
bind=SUPER,F,togglefullscreen
bind=SUPER+SHIFT,Space,togglefloating
bind=SUPER,R,reload_config
bind=SUPER,L,spawn,swaylock -f -c 282c34
bind=SUPER+SHIFT,E,quit
bind=SUPER,Tab,toggleoverview
bind=SUPER,T,setlayout,tile
bind=SUPER,S,setlayout,scroller
bind=SUPER,M,setlayout,monocle
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
# Familiar next/previous navigation from AwesomeWM and GlazeWM.
bind=SUPER,J,focusstack,next
bind=SUPER,K,focusstack,prev
bind=SUPER+CTRL,J,focusdir,left
bind=SUPER+CTRL,K,focusdir,right
bind=SUPER+SHIFT,J,exchange_stack_client,next
bind=SUPER+SHIFT,K,exchange_stack_client,prev
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
