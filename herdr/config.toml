onboarding = false

[keys]
copy_mode = "prefix+x"
close_pane = "prefix+["
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"
new_tab = "prefix+t"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
# "auto" resolves to herdr drawing its own cursor (always a block), which
# ignores shape changes from programs in the pane (e.g. Neovim's guicursor
# block/bar/underline switching). "native" passes the real terminal cursor
# through instead.
host_cursor = "native"
status_indicators = "symbols"
